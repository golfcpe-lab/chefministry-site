<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chef Ministry</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #111;
      color: white;
    }

    .card {
      border: 1px solid #333;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .pro {
      filter: blur(5px);
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.6);
    }

    .btn {
      padding: 10px 20px;
      background: orange;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🔥 Chef Ministry</h1>
<p>Food trend intelligence powered by data</p>

<div id="free"></div>

<h2>🔒 Pro Insights</h2>

<div class="card pro">
  <p>🔥 Hidden restaurant insight</p>
  <p>📈 Momentum data</p>

  <div class="overlay">
    <button class="btn" onclick="goLine()">Unlock Pro (99฿)</button>
  </div>
</div>

<script>
function goLine() {
  window.location.href = "https://line.me/yourlink";
}

fetch("data.json")
.then(res => res.json())
.then(data => {
  const container = document.getElementById("free");

  data.restaurants.forEach(r => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${r.name}</h3>
      <p>🔥 ${r.trend}</p>
      <p>👥 ${r.mentions} influencers</p>
    `;

    container.appendChild(div);
  });
});
</script>

</body>
</html>
