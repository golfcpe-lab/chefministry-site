name: ChefMinistry Scraper

# Pipeline order:
#   1. youtube-scraper   — YouTube API -> youtube_reviews.json  (Sunday + manual only)
#   2. gmaps-scraper     — GMaps Places API -> review snapshots in DB  (daily)
#   3. classify-export   — classify + export JSON + inject data.js  (daily)
#
# Schedules:
#   - Sunday 16:00 UTC (23:00 ICT)  = full run รวม YouTube
#   - Mon–Sat 16:30 UTC (23:30 ICT) = daily GMaps snapshot + export
#
# หมายเหตุความปลอดภัย:
#   - มี "Verify DB integrity" ก่อน scrape — DB พังแล้ว "fail ดัง" ไม่เงียบ
#   - GMaps scrape ไม่มี continue-on-error แล้ว (เดิม silent fail 3 เดือน)
#   - มี freshness guard ท้าย pipeline — snapshot เก่าเกิน 2 วัน = job แดง
on:
  schedule:
    - cron: '0 16 * * 0'     # Sunday full run (with YouTube)
    - cron: '30 16 * * 1-6'  # Mon–Sat daily snapshot
  workflow_dispatch:

concurrency:
  group: chefministry-scraper
  cancel-in-progress: false

jobs:
  # ============================================================
  #  JOB 1 — YouTube Influencer Scraper (Sunday + manual only)
  # ============================================================
  youtube-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * 0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install openai --quiet

      - name: Scrape YouTube channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd scripts/scraper
          python scrape_youtube.py --days 7

      - name: Commit YouTube reviews
        run: |
          git config user.name  "ChefMinistry Bot"
          git config user.email "bot@chefministry.com"
          git add scripts/youtube_reviews.json || true
          git diff --staged --quiet || git commit -m "auto: YouTube reviews $(date +'%Y-%m-%d')"

      - name: Push to GitHub
        run: git push origin main

  # ============================================================
  #  JOB 2 — GMaps Snapshot (daily)
  # ============================================================
  gmaps-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: youtube-scraper
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install requests --quiet

      # ── DB ต้องไม่พัง — ถ้า malformed ให้ fail ทันทีพร้อมคำแนะนำ ──
      - name: Verify DB integrity (fail loud)
        run: |
          cd scripts/scraper
          python -c "
          import sqlite3, sys, pathlib
          DB = pathlib.Path('chefministry_data.db')
          if not DB.exists():
              print('No DB yet — first run'); sys.exit(0)
          try:
              conn = sqlite3.connect(str(DB))
              result = conn.execute('PRAGMA integrity_check').fetchone()[0]
          except Exception as e:
              result = str(e)
          if result != 'ok':
              print('!! DATABASE CORRUPT: ' + result)
              print('!! Restore a good copy of scripts/scraper/chefministry_data.db')
              print('!! (see docs: recover via row-by-row salvage + export_restaurants.json)')
              sys.exit(1)
          n = conn.execute('SELECT COUNT(*) FROM restaurants').fetchone()[0]
          print('DB integrity OK — ' + str(n) + ' restaurants')
          "

      - name: Migrate DB schema (idempotent)
        run: |
          cd scripts/scraper
          python -c "
          import sqlite3, pathlib
          DB = pathlib.Path('chefministry_data.db')
          if not DB.exists():
              print('No DB yet')
              exit(0)
          conn = sqlite3.connect(str(DB))
          cols = [
              ('city','TEXT'), ('province','TEXT'),
              ('country',\"TEXT DEFAULT 'Thailand'\"),
              ('gmaps_types','TEXT'), ('venue_type','TEXT'),
              ('scope_market','TEXT'), ('is_bangkok_focus','INTEGER DEFAULT 0'),
              ('is_restaurant_focus','INTEGER DEFAULT 0'), ('exclude_reason','TEXT'),
              ('place_id','TEXT'), ('creator_mentions_7d','INTEGER DEFAULT 0'),
              ('creator_mentions_30d','INTEGER DEFAULT 0'),
              ('creator_signal_score','REAL DEFAULT 0'),
              ('is_viral_candidate','INTEGER DEFAULT 0'),
              ('candidate_status',\"TEXT DEFAULT 'candidate'\"),
              ('appeared_last_3_cycles','INTEGER DEFAULT 0'),
          ]
          added = []
          for col, defn in cols:
              try:
                  conn.execute('ALTER TABLE restaurants ADD COLUMN ' + col + ' ' + defn)
                  added.append(col)
              except Exception:
                  pass
          conn.commit()
          conn.close()
          print('Migration done: ' + str(len(added)) + ' columns added')
          "
        continue-on-error: true

      # ── Seed discovery: ค้นร้าน premium mass ใหม่ (เฉพาะสั่งรัน manual) ──
      - name: Seed new restaurants (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cd scripts/scraper
          python seed_discover.py --max-new 100

      # ไม่มี continue-on-error แล้ว — scrape พัง = job แดง = ได้ email แจ้งเตือน
      - name: Run GMaps scraper
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cd scripts/scraper
          python scrape_gmaps.py --limit 200

      # ── ตรวจร้านที่ community เสนอ (ผ่าน=ขึ้นเว็บ, เกือบผ่าน=shortlist) ──
      - name: Process community suggestions
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cd scripts/scraper
          python process_suggestions.py

      # VACUUM กัน DB บวม + กัน journal ค้าง ก่อน commit
      - name: Compact DB (VACUUM)
        run: |
          cd scripts/scraper
          python -c "
          import sqlite3
          conn = sqlite3.connect('chefministry_data.db')
          assert conn.execute('PRAGMA integrity_check').fetchone()[0] == 'ok', 'DB corrupt after scrape!'
          conn.execute('VACUUM')
          conn.close()
          print('VACUUM done')
          "

      - name: Commit updated DB
        run: |
          git config user.name  "ChefMinistry Bot"
          git config user.email "bot@chefministry.com"
          git add scripts/scraper/chefministry_data.db scripts/scraper/processed_suggestions.json scripts/scraper/community_shortlist.json || true
          git diff --staged --quiet || git commit -m "auto: GMaps snapshot $(date +'%Y-%m-%d')"
          git pull --rebase origin main

      - name: Push to GitHub
        run: git push origin main

  # ============================================================
  #  JOB 3 — Classify + Export + Inject data.js (daily)
  # ============================================================
  classify-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gmaps-scraper
    if: always() && needs.gmaps-scraper.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Pull latest (DB just pushed by job 2)
        run: git pull origin main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Migrate DB schema (classify-export)
        run: |
          cd scripts/scraper
          python -c "
          import sqlite3, pathlib
          DB = pathlib.Path('chefministry_data.db')
          if not DB.exists(): exit(0)
          conn = sqlite3.connect(str(DB))
          cols = [
              ('city','TEXT'),('province','TEXT'),
              ('country',\"TEXT DEFAULT 'Thailand'\"),
              ('gmaps_types','TEXT'),('venue_type','TEXT'),('scope_market','TEXT'),
              ('is_bangkok_focus','INTEGER DEFAULT 0'),
              ('is_restaurant_focus','INTEGER DEFAULT 0'),
              ('exclude_reason','TEXT'),('place_id','TEXT'),
              ('creator_mentions_7d','INTEGER DEFAULT 0'),
              ('creator_mentions_30d','INTEGER DEFAULT 0'),
              ('creator_signal_score','REAL DEFAULT 0'),
              ('is_viral_candidate','INTEGER DEFAULT 0'),
              ('candidate_status',\"TEXT DEFAULT 'candidate'\"),
              ('appeared_last_3_cycles','INTEGER DEFAULT 0'),
          ]
          added = []
          for col, defn in cols:
              try:
                  conn.execute('ALTER TABLE restaurants ADD COLUMN ' + col + ' ' + defn)
                  added.append(col)
              except Exception:
                  pass
          conn.commit()
          conn.close()
          print('Migration: ' + str(len(added)) + ' columns added')
          "
        continue-on-error: true

      - name: Backfill classification for new/unclassified records
        run: |
          cd scripts/scraper
          python -c "
          import sqlite3, json, pathlib, sys
          sys.path.insert(0, '.')
          from classify import classify_record
          DB = pathlib.Path('chefministry_data.db')
          if not DB.exists():
              print('No DB yet'); exit(0)
          conn = sqlite3.connect(str(DB))
          conn.row_factory = sqlite3.Row
          with conn:
              rows = conn.execute('''
                  SELECT id, name, area, cuisine,
                         COALESCE(gmaps_types, '[]') AS gmaps_types_json
                  FROM restaurants
                  WHERE scope_market IS NULL OR scope_market = ''
              ''').fetchall()
              updated = 0
              for row in rows:
                  try:
                      gmaps_types = json.loads(row['gmaps_types_json'] or '[]')
                  except Exception:
                      gmaps_types = []
                  rec = classify_record({
                      'name': row['name'], 'area': row['area'] or '',
                      'cuisine': row['cuisine'] or '', 'gmaps_types': gmaps_types,
                  })
                  conn.execute('''UPDATE restaurants SET
                      city=?, province=?, venue_type=?, scope_market=?,
                      is_bangkok_focus=?, is_restaurant_focus=?, exclude_reason=?
                      WHERE id=?''', (
                      rec.get('city',''), rec.get('province',''),
                      rec.get('venue_type','unknown'), rec.get('scope_market','needs_review'),
                      1 if rec.get('is_bangkok_focus') else 0,
                      1 if rec.get('is_restaurant_focus') else 0,
                      rec.get('exclude_reason'), row['id'],
                  ))
                  updated += 1
          conn.commit()
          conn.close()
          print('Classified ' + str(updated) + ' new records')
          "
        continue-on-error: true

      # --inject = อัปเดต js/data.js ทุกวัน (เดิมรอ Monday อย่างเดียว)
      - name: Export + inject into data.js
        env:
          EXPORT_DIR: ${{ github.workspace }}/js
        run: |
          cd scripts/scraper
          python export_signals.py --inject

      - name: Validate schema v2 in exported JSON
        run: |
          python -c "
          import json, pathlib, sys
          p = pathlib.Path('scripts/scraper/export_restaurants.json')
          if not p.exists():
              print('export_restaurants.json missing'); sys.exit(0)
          records = json.load(open(p, encoding='utf-8'))
          required = ['city','province','venue_type','scope_market','is_bangkok_focus','is_restaurant_focus']
          ok = all(f in records[0] for f in required) if records else False
          if ok:
              in_scope = sum(1 for r in records if r.get('is_restaurant_focus'))
              bkk      = sum(1 for r in records if r.get('is_bangkok_focus'))
              review   = sum(1 for r in records if r.get('scope_market') == 'needs_review')
              print(f'Schema v2 OK — {len(records)} records | in-scope: {in_scope} | bkk: {bkk} | review: {review}')
          else:
              missing = [f for f in required if f not in (records[0] if records else {})]
              print(f'SCHEMA WARNING — missing fields: {missing}')
          "
        continue-on-error: true

      - name: Commit classified export + data.js
        run: |
          git config user.name  "ChefMinistry Bot"
          git config user.email "bot@chefministry.com"
          git add scripts/scraper/export_restaurants.json scripts/scraper/chefministry_data.db js/data.js || true
          git diff --staged --quiet || git commit -m "auto: daily signal update $(date +'%Y-%m-%d')"
          git pull --rebase origin main

      - name: Push to GitHub
        run: git push origin main

      # ── Freshness guard: snapshot ล่าสุดต้องไม่เก่าเกิน 2 วัน ──
      - name: Freshness guard (fail if data stale)
        run: |
          cd scripts/scraper
          python -c "
          import sqlite3, sys
          from datetime import date, timedelta
          conn = sqlite3.connect('chefministry_data.db')
          latest = conn.execute('SELECT MAX(snapshot_date) FROM review_snapshots').fetchone()[0]
          print('Latest snapshot: ' + str(latest))
          if latest is None or date.fromisoformat(latest) < date.today() - timedelta(days=2):
              print('!! DATA IS STALE — pipeline is not collecting new snapshots')
              sys.exit(1)
          print('Freshness OK')
          "
