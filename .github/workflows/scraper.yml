name: ChefMinistry Sunday Scraper
 
# รันทุกวันอาทิตย์ 23:00 ICT (16:00 UTC)
# YouTube + GMaps รันพร้อมกัน → ข้อมูลพร้อมก่อน weekly summary จันทร์ 08:00 ICT
on:
  schedule:
    - cron: '0 16 * * 0'   # อาทิตย์ 16:00 UTC = อาทิตย์ 23:00 ICT
  workflow_dispatch:
 
jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  #  JOB 1 — YouTube Influencer Scraper (API only — ไม่ต้องใช้ browser)
  # ══════════════════════════════════════════════════════════════════════════════
  youtube-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
 
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install Python packages
        run: pip install openai --quiet
 
      - name: Scrape YouTube channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          SCRIPTS_DIR:     ${{ github.workspace }}/scripts
        run: |
          cd scripts/scraper
          python scrape_youtube.py --days 7
 
      - name: Commit YouTube reviews
        run: |
          git config user.name  "ChefMinistry Bot"
          git config user.email "bot@chefministry.com"
          git add scripts/youtube_reviews.json
          git diff --staged --quiet || git commit -m "auto: YouTube reviews $(date +'%Y-%m-%d')"
 
      - name: Push to GitHub
        run: git push origin main
 
  # ══════════════════════════════════════════════════════════════════════════════
  #  JOB 2 — GMaps Snapshot (ต้องมี chefministry_data.db ใน repo ก่อน)
  #  รันหลัง youtube-scraper เสร็จเสมอ (needs: youtube-scraper)
  # ══════════════════════════════════════════════════════════════════════════════
  gmaps-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: youtube-scraper   # รอ YouTube เสร็จก่อน แล้วค่อยรัน GMaps
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
 
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install Python packages
        run: pip install requests --quiet
 
      - name: Run GMaps scraper
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cd scripts/scraper
          python scrape_gmaps.py --limit 200
        continue-on-error: true   # ถ้าไม่มี DB ให้ข้ามไป ไม่หยุด workflow
 
      - name: Commit updated data
        run: |
          git config user.name  "ChefMinistry Bot"
          git config user.email "bot@chefministry.com"
          git pull --rebase origin main   # sync ก่อน เพราะ youtube job เพิ่ง push
          git add scripts/scraper/chefministry_data.db
          git diff --staged --quiet || git commit -m "auto: GMaps snapshot $(date +'%Y-%m-%d')"
 
      - name: Push to GitHub
        run: git push origin main
