name: ChefMinistry Weekly Update

# Every Monday 09:00 ICT (02:00 UTC) — หลัง Cowork FB digest task (08:08 ICT) ทำงานเสร็จ
# หรือ trigger ได้ manual / จาก scheduled task ผ่าน workflow_dispatch
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install openai --quiet

      # Step 4a: Migrate DB schema (idempotent — adds columns if missing)
      - name: Migrate DB classification columns
        env:
          EXPORT_DIR: ${{ github.workspace }}/js
        run: |
          cd scripts/scraper
          python -c "from db import init_db; init_db(); print('DB migration complete')"
        continue-on-error: true

      # Step 4b: Backfill classification for unclassified DB records
      - name: Backfill venue/scope classification
        env:
          EXPORT_DIR: ${{ github.workspace }}/js
        run: |
          cd scripts/scraper
          python -c "
          from db import get_conn, init_db
          from classify import classify_record
          import json
          init_db()
          with get_conn() as conn:
              rows = conn.execute('''
                  SELECT id, name, area, cuisine,
                         COALESCE(gmaps_types, '[]') AS gmaps_types_json
                  FROM restaurants
                  WHERE scope_market IS NULL OR scope_market = ''
              ''').fetchall()
              updated = 0
              for row in rows:
                  try:
                      gmaps_types = json.loads(row['gmaps_types_json'] or '[]')
                  except Exception:
                      gmaps_types = []
                  rec = classify_record({
                      'name': row['name'], 'area': row['area'] or '',
                      'cuisine': row['cuisine'] or '', 'gmaps_types': gmaps_types,
                  })
                  conn.execute('''UPDATE restaurants SET
                      city=?, province=?, venue_type=?, scope_market=?,
                      is_bangkok_focus=?, is_restaurant_focus=?, exclude_reason=?
                      WHERE id=?''', (
                      rec.get('city',''), rec.get('province',''),
                      rec.get('venue_type','unknown'), rec.get('scope_market','needs_review'),
                      1 if rec.get('is_bangkok_focus') else 0,
                      1 if rec.get('is_restaurant_focus') else 0,
                      rec.get('exclude_reason'), row['id'],
                  ))
                  updated += 1
          print(f'Backfilled {updated} records')
          "
        continue-on-error: true

      # Step 4c: Export DB signals → inject CM_EXTERNAL_RESTAURANTS into data.js
      # export_signals.py calls classify_record() on every record so output
      # includes all schema v2 classification fields.
      - name: Export DB signals into data.js
        id: export_signals
        env:
          EXPORT_DIR: ${{ github.workspace }}/js
        run: |
          cd scripts/scraper
          python export_signals.py --inject
          # Guard: verify injection produced actual records (don't let empty DB overwrite good data)
          python -c "
          import json, pathlib, sys
          p = pathlib.Path('export_restaurants.json')
          if p.exists():
              recs = json.load(open(p))
              in_scope = sum(1 for r in recs if r.get('is_restaurant_focus'))
              print('Exported %d records (%d in-scope)' % (len(recs), in_scope))
          else:
              print('No export file found')
          "
        continue-on-error: true

      - name: Inject YouTube signals into data.js
        id: inject_youtube
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DATA_FILE:      ${{ github.workspace }}/js/data.js
          YOUTUBE_FILE:   ${{ github.workspace }}/scripts/youtube_reviews.json
        run: |
          cd scripts/scraper
          python inject_youtube.py
        continue-on-error: true

      # ── NEW: FB Digest Injection ────────────────────────────────────────────
      # ── ดึง FB digest จาก Firestore (Cowork task เขียนไว้ — ไม่ต้องพึ่งไฟล์ในเครื่อง) ──
      - name: Fetch FB digest from Firestore
        run: |
          python -c "
          import json, urllib.request, pathlib
          URL = ('https://firestore.googleapis.com/v1/projects/chefministry-d50e9'
                 '/databases/(default)/documents/cm_fb_digest/latest'
                 '?key=AIzaSyA6-SU_06S9zjCzXBKDtAl1lBuLl9JU9nY')
          local = pathlib.Path('scripts/scraper/fb_digest.json')
          try:
              doc = json.loads(urllib.request.urlopen(URL, timeout=30).read())
              payload = doc.get('fields', {}).get('payload', {}).get('stringValue', '')
              digest = json.loads(payload)
              assert isinstance(digest.get('entries'), list) and digest.get('digest_date'), 'bad schema'
              old_date = ''
              if local.exists():
                  try: old_date = json.loads(local.read_text(encoding='utf-8')).get('digest_date','')
                  except Exception: pass
              if digest['digest_date'] > old_date:
                  local.write_text(json.dumps(digest, ensure_ascii=False, indent=1), encoding='utf-8')
                  print('Digest updated from Firestore:', digest['digest_date'], '(', len(digest['entries']), 'entries )')
              else:
                  print('Firestore digest not newer (', digest['digest_date'], '<=', old_date, ') — keep existing')
          except Exception as e:
              print('No Firestore digest available (', e, ') — keep existing file')
          "
        continue-on-error: true

      # อ่าน fb_digest.json (บันทึกโดย Cowork scheduled task ทุกวันจันทร์)
      # แล้ว inject CM_FB_DIGEST + อัปเดต weeklyHighlight ใน data.js
      - name: Inject FB weekly digest into data.js
        id: inject_fb
        env:
          DATA_FILE: ${{ github.workspace }}/js/data.js
        run: |
          DIGEST="scripts/scraper/fb_digest.json"
          if [ -f "$DIGEST" ]; then
            python -c "
          import json, pathlib
          d = json.loads(pathlib.Path('$DIGEST').read_text(encoding='utf-8'))
          entries = [e for e in d.get('entries', []) if not e.get('is_watchlist')]
          print('FB digest: %s | %d entries | %s' % (d.get('week_label','?'), len(entries), d.get('digest_date','?')))
          "
            python scripts/scraper/inject_fb_digest.py --digest "$DIGEST"
          else
            echo "ℹ️  fb_digest.json not found — skipping FB digest injection"
          fi
        continue-on-error: true

      - name: Run weekly_summary.py
        id: weekly_summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DATA_FILE:      ${{ github.workspace }}/js/data.js
          YOUTUBE_FILE:   ${{ github.workspace }}/scripts/youtube_reviews.json
        run: python scripts/weekly_summary.py
        continue-on-error: true

      # Validate schema v2 fields are present in export JSON
      - name: Validate classification schema in export
        run: |
          python -c "
          import json, sys, pathlib
          p = pathlib.Path('scripts/scraper/export_restaurants.json')
          if not p.exists():
              print('export_restaurants.json not found'); sys.exit(0)
          records = json.load(open(p, encoding='utf-8'))
          required = ['city','province','venue_type','scope_market','is_bangkok_focus','is_restaurant_focus']
          ok = all(f in records[0] for f in required) if records else False
          if ok:
              in_scope = sum(1 for r in records if r.get('is_restaurant_focus'))
              bkk = sum(1 for r in records if r.get('is_bangkok_focus'))
              review = sum(1 for r in records if r.get('scope_market') == 'needs_review')
              print(f'Schema v2 OK — {len(records)} records | in-scope: {in_scope} | bkk: {bkk} | review: {review}')
          else:
              missing = [f for f in required if f not in (records[0] if records else {})]
              print(f'SCHEMA WARNING — missing: {missing}')
          "
        continue-on-error: true

      - name: Commit updated data.js and export JSON
        run: |
          git config user.name  "ChefMinistry Bot"
          git config user.email "bot@chefministry.com"
          git add js/data.js scripts/scraper/export_restaurants.json scripts/scraper/fb_digest.json scripts/scraper/chefministry_data.db || true
          git diff --staged --quiet || git commit -m "auto: weekly signal update $(date +'%Y-%m-%d') [schema-v2+fb-digest]"

      - name: Push to GitHub
        run: git push origin main

      # ── Surface silent failures ──────────────────────────────────────────────
      # continue-on-error ทำให้ step พังแล้ว workflow ยังเขียว — เคยซ่อนปัญหา
      # DB พัง 3 เดือน + weeklyHighlight ค้างตั้งแต่เมษา step นี้รันหลัง push
      # (data ที่ดีถูก commit ไปแล้ว) แล้วทำให้ workflow แดงถ้ามี step สำคัญพัง
      - name: Fail workflow if critical steps failed silently
        if: always()
        run: |
          failed=""
          [ "${{ steps.export_signals.outcome }}" = "failure" ]  && failed="$failed export_signals"
          [ "${{ steps.inject_youtube.outcome }}" = "failure" ]  && failed="$failed inject_youtube"
          [ "${{ steps.inject_fb.outcome }}" = "failure" ]       && failed="$failed inject_fb"
          [ "${{ steps.weekly_summary.outcome }}" = "failure" ]  && failed="$failed weekly_summary"
          if [ -n "$failed" ]; then
            echo "::error::Critical steps failed silently:$failed — ดู log ของ step ด้านบน"
            exit 1
          fi
          echo "✅ All critical steps succeeded"
